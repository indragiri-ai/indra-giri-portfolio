name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny token permissions by default. Each job receives only what it needs.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Gate on what ships. The export is static HTML, so devDependencies
      # (Tailwind, ESLint) never reach visitors; an advisory there with no
      # patched release (e.g. braces <=3.0.3) would otherwise block every
      # deploy. Run `npm audit` locally to see build tooling too.
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint and typecheck
        run: npm run check

      - name: Build
        run: npm run build
        env:
          # Custom domain served from the root, so no base path.
          NEXT_PUBLIC_SITE_URL: https://indragiri.com.np
          # The form ID is public; use the portfolio form unless overridden.
          NEXT_PUBLIC_FORMSPREE_ID: ${{ secrets.FORMSPREE_ID || 'mrpepzrk' }}

      - name: Verify static export
        run: npm run verify:export

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: out

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
